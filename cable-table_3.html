<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CL-CS Cable List</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600&display=swap">

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:      #08111F;
  --surface: #0D1929;
  --border:  #162438;
  --border2: #1F3250;
  --text:    #C8DCF0;
  --muted:   #4A6A8A;
  --accent:  #3A8FD8;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', system-ui, sans-serif;
  font-size: 14px;
  min-height: 100vh;
}

/* ── Top bar ── */
.topbar {
  padding: 16px 24px 0;
  border-bottom: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 0;
}
.topbar-head {
  display: flex;
  align-items: baseline;
  gap: 14px;
  margin-bottom: 14px;
}
.topbar-head h1 {
  font-size: 17px;
  font-weight: 600;
  color: #E0EEFA;
  letter-spacing: -0.02em;
}
.topbar-head .sub {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--muted);
}

/* ── Room tabs ── */
.room-tabs {
  display: flex;
  gap: 0;
}
.rtab {
  padding: 9px 22px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  font-weight: 600;
  color: var(--muted);
  border: none;
  background: transparent;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all 0.12s;
  letter-spacing: 0.04em;
}
.rtab:hover { color: var(--text); }
.rtab.active.all  { color: var(--accent); border-bottom-color: var(--accent); }
.rtab.active.dh61 { color: #3ECF90; border-bottom-color: #3ECF90; }
.rtab.active.dh62 { color: #E0993A; border-bottom-color: #E0993A; }
.rtab .badge {
  display: inline-block;
  font-size: 10px;
  padding: 1px 6px;
  border-radius: 10px;
  margin-left: 6px;
  font-weight: 400;
}
.rtab.all  .badge { background:#162A3E; color:#5A8AB0; }
.rtab.dh61 .badge { background:#0D2218; color:#3ECF90; }
.rtab.dh62 .badge { background:#2A1A06; color:#E0993A; }

/* ── Filter panel ── */
.filter-panel {
  padding: 12px 24px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  align-items: flex-start;
}
.filter-group { display: flex; flex-direction: column; gap: 6px; }
.filter-label {
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
  font-family: 'JetBrains Mono', monospace;
}

/* A-End position pills */
.pos-pills { display: flex; flex-wrap: wrap; gap: 4px; }
.pill {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  padding: 3px 9px;
  border-radius: 4px;
  border: 1px solid var(--border2);
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.1s;
  white-space: nowrap;
}
.pill:hover { border-color: var(--accent); color: var(--accent); }
.pill.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.pill.pill-all { border-color: #2A4060; }
.pill.pill-all.active { background: #1E3554; border-color: #3A6090; color: #90C0E8; }

/* Length pills */
.len-pills { display: flex; flex-wrap: wrap; gap: 4px; }
.lpill {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  padding: 3px 9px;
  border-radius: 4px;
  border: 1px solid transparent;
  cursor: pointer;
  color: #000;
  font-weight: 700;
  opacity: 0.38;
  transition: opacity 0.1s;
}
.lpill.active { opacity: 1; }
.lpill:hover  { opacity: 0.8; }
.lpill.lpill-all {
  background: #1E3554 !important;
  border: 1px solid #3A6090 !important;
  color: #90C0E8 !important;
  font-weight: 600;
  opacity: 0.5;
}
.lpill.lpill-all.active { opacity: 1; }

/* Search */
.search-box {
  background: var(--bg);
  border: 1px solid var(--border2);
  border-radius: 6px;
  padding: 5px 12px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--text);
  width: 170px;
  outline: none;
}
.search-box:focus { border-color: var(--accent); }
.search-box::placeholder { color: var(--muted); }

/* ── Count bar ── */
.count-bar {
  padding: 6px 24px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--muted);
  border-bottom: 1px solid var(--border);
}
.count-bar .cnt { color: #7AAFDA; font-weight: 600; }

/* ── Table ── */
.table-wrap {
  overflow-x: auto;
  overflow-y: auto;
  max-height: calc(100vh - 260px);
}
table { width: 100%; border-collapse: collapse; font-family: 'JetBrains Mono', monospace; font-size: 12.5px; }

thead th {
  position: sticky; top: 0;
  background: #0A1828;
  padding: 9px 14px;
  text-align: left;
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
  border-bottom: 2px solid var(--border2);
  white-space: nowrap;
  cursor: pointer;
  user-select: none;
}
thead th:hover { color: var(--text); }
thead th .si { margin-left: 3px; opacity: 0.35; }
thead th.sorted .si { opacity: 1; color: var(--accent); }

tbody tr { box-shadow: inset 0 -1px 0 var(--border); }
tbody tr:hover { background: #111E30; }

tbody tr.grp-hdr td {
  background: #0B1A2C;
  font-size: 11px;
  color: #3A7AC0;
  font-weight: 700;
  letter-spacing: 0.06em;
}
tbody tr.grp-hdr { box-shadow: inset 0 -1px 0 #152030; }

td { padding: 7px 14px; white-space: nowrap; }

td.a-end { font-weight: 700; color: #70AEDE; }
td.z-end { font-weight: 700; }
td.z-end.dh61 { color: #3ECF90; }
td.z-end.dh62 { color: #E0993A; }
td.port { color: #4A6A8A; }
td.arrow { color: #243848; font-size: 14px; }

.len-badge {
  display: inline-block;
  padding: 2px 11px;
  border-radius: 12px;
  font-size: 12px;
  font-weight: 700;
  color: #000;
  min-width: 54px;
  text-align: center;
}

/* ── Room chip in Z-end col ── */
.room-chip {
  display: inline-block;
  font-size: 9px;
  padding: 1px 5px;
  border-radius: 4px;
  margin-left: 5px;
  font-weight: 600;
  vertical-align: middle;
}
.room-chip.dh61 { background: #0D2218; color: #3ECF90; }
.room-chip.dh62 { background: #2A1A06; color: #E0993A; }

.empty { padding: 48px; text-align: center; color: var(--muted); font-family: 'JetBrains Mono', monospace; font-size: 13px; }

.navlink {
  display: flex;
  align-items: center;
  gap: 7px;
  margin-left: auto;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.02em;
  color: var(--text);
  text-decoration: none;
  padding: 8px 14px;
  border-radius: 999px;
  background: var(--surface);
  border: 1px solid var(--border2);
  transition: all 0.12s;
  white-space: nowrap;
}
.navlink:hover { border-color: var(--accent); color: var(--accent); }

/* ── Sticky first column (helps horizontal scroll on mobile) ── */
.table-wrap { position: relative; }
thead th:first-child { left: 0; z-index: 2; }
tbody tr:not(.grp-hdr) td.a-end { position: sticky; left: 0; background: var(--bg); }
tbody tr:not(.grp-hdr):hover td.a-end { background: #111E30; }

/* ── Mobile ── */
@media (max-width: 640px) {
  body { font-size: 13px; }
  .topbar { padding: 12px 14px 0; }
  .topbar-head { flex-wrap: wrap; gap: 6px 12px; margin-bottom: 10px; }
  .topbar-head h1 { font-size: 15px; }
  .navlink { margin-left: 0; order: 3; width: 100%; justify-content: center; }
  .room-tabs { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .rtab { padding: 8px 16px; font-size: 11px; flex: 0 0 auto; }

  .filter-panel { padding: 10px 14px; gap: 12px; }
  .filter-group { width: 100%; }
  .pos-pills, .len-pills { max-height: 96px; overflow-y: auto; }
  .search-box { width: 100%; }

  .count-bar { padding: 6px 14px; }

  .table-wrap { max-height: calc(100vh - 330px); }
  table { font-size: 11.5px; }
  thead th, td { padding: 7px 9px; }
  thead th { font-size: 9px; }
  .len-badge { min-width: 44px; padding: 2px 8px; font-size: 11px; }
  .room-chip { display: block; margin-left: 0; margin-top: 2px; width: fit-content; }
}
</style>
</head>

// ── State ──
let filterRoom = '';
let filterPos  = null;
let filterLen  = null;
let searchQ    = '';
let sortCol    = 4;
let sortDir    = 1;

// ── Room tabs ──
document.querySelectorAll('.rtab').forEach(btn => {
  btn.addEventListener('click', () => {
    filterRoom = btn.dataset.room;
    filterPos = null;  // reset A-End filter when switching room
    document.querySelectorAll('.rtab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    updatePosPills();
    render();
  });
});

// ── A-End position pills ──
const allPositions = [...new Set(RAW.map(r=>r[0]))].sort();

function updatePosPills() {
  const container = document.getElementById('pos-pills');
  container.innerHTML = '';

  // Which positions are visible in current room filter?
  const visible = filterRoom
    ? [...new Set(RAW.filter(r=>r[5]===filterRoom).map(r=>r[0]))].sort()
    : allPositions;

  const allBtn = document.createElement('button');
  allBtn.className = 'pill pill-all' + (!filterPos ? ' active' : '');
  allBtn.textContent = 'ทั้งหมด';
  allBtn.onclick = () => { filterPos=null; updatePosPills(); render(); };
  container.appendChild(allBtn);

  visible.forEach(pos => {
    const b = document.createElement('button');
    b.className = 'pill' + (filterPos===pos ? ' active' : '');
    b.textContent = pos;
    b.onclick = () => { filterPos=pos; updatePosPills(); render(); };
    container.appendChild(b);
  });
}
updatePosPills();

// ── Length pills ──
const lenList = [...new Set(RAW.map(r=>r[4]))].sort((a,b)=>a-b);
const lenPillsEl = document.getElementById('len-pills');

const allLBtn = document.createElement('button');
allLBtn.className = 'lpill lpill-all active';
allLBtn.textContent = 'ทั้งหมด';
allLBtn.onclick = () => { filterLen=null; setActiveLpill(null); render(); };
lenPillsEl.appendChild(allLBtn);

lenList.forEach(len => {
  const b = document.createElement('button');
  b.className = 'lpill';
  b.style.background = LEN_COLORS[len];
  b.textContent = len + ' m';
  b.dataset.val = len;
  b.onclick = () => { filterLen=len; setActiveLpill(len); render(); };
  lenPillsEl.appendChild(b);
});

function setActiveLpill(val) {
  lenPillsEl.querySelectorAll('.lpill').forEach(p => {
    const isAll = p.classList.contains('lpill-all');
    p.classList.toggle('active', val===null ? isAll : Number(p.dataset.val)===val);
  });
}

// ── Search ──
document.getElementById('search').addEventListener('input', e => {
  searchQ = e.target.value.trim().toLowerCase();
  render();
});

// ── Sort headers ──
document.querySelectorAll('thead th[data-col]').forEach(th => {
  th.addEventListener('click', () => {
    const col = Number(th.dataset.col);
    if (sortCol===col) sortDir*=-1; else { sortCol=col; sortDir=1; }
    document.querySelectorAll('thead th').forEach(t=>t.classList.remove('sorted'));
    th.classList.add('sorted');
    th.querySelector('.si').textContent = sortDir===1?'↑':'↓';
    render();
  });
});

// ── Render (virtualized: only the rows on screen ever touch the DOM,
//    so scrolling stays smooth on mobile even with 3,456 rows) ──
const ROW_H = 31; // px — must match the height set on each <tr> below
const BUFFER = 10; // extra rows rendered above/below the viewport

const wrapEl = document.getElementById('table-wrap');
const tbody  = document.getElementById('tbody');
const empty  = document.getElementById('empty');

let flatRows = []; // flattened list of {type:'group',label} / {type:'data',r}
let rafId = null;

function rowHTML(item) {
  if (item.type === 'group') {
    return `<tr class="grp-hdr" style="height:${ROW_H}px"><td colspan="6">▸ ${item.label}</td></tr>`;
  }
  const r = item.r;
  const c = LEN_COLORS[r[4]]||'#888';
  const roomClass = r[5]; // dh61 or dh62
  return `<tr style="height:${ROW_H}px">
      <td class="a-end">${r[0]}</td>
      <td class="port">${r[1]}</td>
      <td class="arrow">→</td>
      <td class="z-end ${roomClass}">${r[2]}<span class="room-chip ${roomClass}">${r[5].toUpperCase()}</span></td>
      <td class="port">${r[3]}</td>
      <td><span class="len-badge" style="background:${c}">${r[4]} m</span></td>
    </tr>`;
}

function renderWindow() {
  const total = flatRows.length;
  if (!total) { tbody.innerHTML = ''; return; }

  const viewportH = wrapEl.clientHeight;
  let start = Math.floor(wrapEl.scrollTop / ROW_H) - BUFFER;
  let end   = Math.ceil((wrapEl.scrollTop + viewportH) / ROW_H) + BUFFER;
  start = Math.max(0, start);
  end   = Math.min(total, end);

  const topH = start * ROW_H;
  const botH = (total - end) * ROW_H;

  let html = '';
  if (topH > 0) html += `<tr style="height:${topH}px"><td colspan="6" style="padding:0;border:0"></td></tr>`;
  for (let i = start; i < end; i++) html += rowHTML(flatRows[i]);
  if (botH > 0) html += `<tr style="height:${botH}px"><td colspan="6" style="padding:0;border:0"></td></tr>`;
  tbody.innerHTML = html;
}

wrapEl.addEventListener('scroll', () => {
  if (rafId) return;
  rafId = requestAnimationFrame(() => { rafId = null; renderWindow(); });
}, { passive: true });

function render() {
  let data = RAW;
  if (filterRoom) data = data.filter(r => r[5]===filterRoom);
  if (filterPos)  data = data.filter(r => r[0]===filterPos);
  if (filterLen!==null) data = data.filter(r => r[4]===filterLen);
  if (searchQ)    data = data.filter(r =>
    r[0].includes(searchQ)||r[1].includes(searchQ)||
    r[2].includes(searchQ)||r[3].includes(searchQ)||String(r[4]).includes(searchQ)
  );

  data = [...data].sort((a,b) => {
    let av=a[sortCol], bv=b[sortCol];
    if (typeof av==='string') return sortDir*av.localeCompare(bv,undefined,{numeric:true});
    return sortDir*(av-bv);
  });

  document.getElementById('row-count').textContent = data.length.toLocaleString();

  if (!data.length) { flatRows=[]; tbody.innerHTML=''; empty.style.display='block'; return; }
  empty.style.display = 'none';

  // group header when sorting by A-End and not filtered to single pos
  const showGroups = !filterPos && sortCol===0;
  flatRows = [];
  let lastPos = null;
  for (const r of data) {
    if (showGroups && r[0]!==lastPos) {
      lastPos = r[0];
      flatRows.push({type:'group', label:r[0]});
    }
    flatRows.push({type:'data', r});
  }

  wrapEl.scrollTop = 0;
  renderWindow();
}

render();
</script>

</html>
