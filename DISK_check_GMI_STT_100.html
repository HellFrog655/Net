<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DISK Check — GMI / STT 存储 100台</title>
<style>
:root{
  --paper:#F4F5F3; --card:#FFFFFF; --ink:#15191C; --ink2:#5C666C; --rule:#DADFDC;
  --umis:#9A6400; --umisbg:#FBF2DF;
  --samsung:#17518E; --samsungbg:#E7EFF8;
  --dapu:#1F6B4A; --dapubg:#E3F1E9;
  --done:#12805C; --hit:#FFF0A8; --shadow:0 1px 0 rgba(21,25,28,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Thai",sans-serif;
  font-size:15px; line-height:1.45; -webkit-text-size-adjust:100%;
}
.mono{font-family:ui-monospace,"SF Mono","JetBrains Mono","Cascadia Mono",Consolas,monospace;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px 96px}

/* ---- masthead ---- */
header{border-bottom:1px solid var(--rule);background:var(--card)}
.mast{max-width:1080px;margin:0 auto;padding:18px 16px 14px;display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap}
h1{font-size:17px;font-weight:650;margin:0 0 2px;letter-spacing:-.01em}
.sub{font-size:12.5px;color:var(--ink2);margin:0}
.langs{margin-left:auto;display:flex;gap:2px}
.langs button{font:inherit;font-size:12.5px;padding:5px 11px;border:1px solid var(--rule);background:var(--card);color:var(--ink2);cursor:pointer}
.langs button:first-child{border-radius:6px 0 0 6px}
.langs button:last-child{border-radius:0 6px 6px 0}
.langs button+button{border-left:0}
.langs button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}

.pagelinks{max-width:1080px;margin:0 auto;padding:0 16px 12px;display:flex;flex-wrap:wrap;gap:6px}
.pagelinks a{font-size:12px;color:var(--ink2);text-decoration:none;border:1px solid var(--rule);padding:5px 11px;border-radius:6px;white-space:nowrap}
.pagelinks a:hover{border-color:var(--ink);color:var(--ink)}

/* ---- tally ---- */
.tally{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:8px;overflow:hidden;margin:18px 0 14px}
.t{background:var(--card);padding:12px 14px}
.t .n{font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.t .n small{font-size:14px;font-weight:450;color:var(--ink2)}
.t .lbl{font-size:12px;color:var(--ink2);margin-top:1px}
.t .bar{height:4px;background:var(--rule);border-radius:2px;margin-top:9px;overflow:hidden}
.t .bar i{display:block;height:100%;width:0;background:var(--done);transition:width .25s}
.t[data-b="UMIS"] .bar i{background:var(--umis)}
.t[data-b="SAMSUNG"] .bar i{background:var(--samsung)}
.t[data-b="DAPU"] .bar i{background:var(--dapu)}

/* ---- controls ---- */
.controls{position:sticky;top:0;z-index:20;background:var(--paper);padding:10px 0 9px;border-bottom:1px solid var(--rule)}
.searchrow{display:flex;gap:8px;align-items:center}
#q{flex:1;min-width:0;font:inherit;font-size:15px;padding:11px 13px;border:1.5px solid var(--rule);border-radius:8px;background:var(--card);color:var(--ink)}
#q:focus{outline:2px solid var(--ink);outline-offset:-1px;border-color:var(--ink)}
#q::placeholder{color:#9AA3A8}
.scan{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink2);white-space:nowrap;cursor:pointer;padding:0 4px}
.scan input{width:17px;height:17px;accent-color:var(--done)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.chip{font:inherit;font-size:12.5px;padding:5px 11px;border:1px solid var(--rule);background:var(--card);color:var(--ink2);border-radius:20px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.chip .c{opacity:.6;margin-left:5px}
.spacer{flex:1}
.act{font:inherit;font-size:12.5px;padding:5px 11px;border:1px solid var(--rule);background:var(--card);color:var(--ink2);border-radius:6px;cursor:pointer}
.act:hover{border-color:var(--ink);color:var(--ink)}

/* ---- list ---- */
.count{font-size:12.5px;color:var(--ink2);margin:14px 0 8px}
.srv{background:var(--card);border:1px solid var(--rule);border-left-width:4px;border-radius:7px;margin-bottom:7px;box-shadow:var(--shadow)}
.srv[data-b="UMIS"]{border-left-color:var(--umis)}
.srv[data-b="SAMSUNG"]{border-left-color:var(--samsung)}
.srv[data-b="DAPU"]{border-left-color:var(--dapu)}
.srv.done{background:#FAFCFA;border-color:#BFDCCF;border-left-color:var(--done)}
.head{display:flex;align-items:center;gap:12px;padding:11px 13px}
.head input[type=checkbox]{width:21px;height:21px;flex:none;accent-color:var(--done);cursor:pointer}
.id{font-size:15.5px;font-weight:600;letter-spacing:.01em}
.srv.done .id{color:var(--done)}
.tag{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:4px}
.tag[data-b="UMIS"]{background:var(--umisbg);color:var(--umis)}
.tag[data-b="SAMSUNG"]{background:var(--samsungbg);color:var(--samsung)}
.tag[data-b="DAPU"]{background:var(--dapubg);color:var(--dapu)}
.fw{font-size:12px;color:var(--ink2)}
.prog{margin-left:auto;font-size:12.5px;color:var(--ink2);white-space:nowrap}
.prog b{color:var(--ink);font-weight:600}
.toggle{font:inherit;font-size:12.5px;padding:6px 10px;border:1px solid var(--rule);background:var(--card);color:var(--ink2);border-radius:6px;cursor:pointer}
.toggle:hover{border-color:var(--ink);color:var(--ink)}
.disks{display:none;border-top:1px solid var(--rule);padding:9px 13px 12px}
.srv.open .disks{display:block}
.meta{font-size:12px;color:var(--ink2);margin:0 0 9px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(224px,1fr));gap:2px}
.d{display:flex;align-items:center;gap:9px;padding:5px 7px;border-radius:5px;font-size:13.5px}
.d:hover{background:#F2F4F2}
.d input{width:17px;height:17px;flex:none;accent-color:var(--done);cursor:pointer}
.slot{font-size:11.5px;color:#98A1A6;width:17px;text-align:right;flex:none}
.d.on span.sn{color:var(--done);text-decoration:line-through;text-decoration-thickness:1px}
.d.hit{background:var(--hit)}
.empty{padding:34px 4px;color:var(--ink2);font-size:14px}
.empty b{color:var(--ink);font-weight:600}

/* ---- toast ---- */
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(120%);background:var(--ink);color:#fff;padding:11px 17px;border-radius:8px;font-size:13.5px;z-index:60;transition:transform .18s ease;max-width:90vw}
#toast.show{transform:translateX(-50%) translateY(0)}
#toast.bad{background:#8C2B23}
footer{font-size:12px;color:var(--ink2);border-top:1px solid var(--rule);margin-top:26px;padding-top:12px}
@media (max-width:640px){
  .tally{grid-template-columns:repeat(2,1fr)}
  .prog{width:100%;margin:0;order:9}
  .head{flex-wrap:wrap}
  .grid{grid-template-columns:1fr 1fr}
  .pagelinks a{flex:1 1 auto;text-align:center}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

let L="th", t=T.th;
const BRANDS=["UMIS","SAMSUNG","DAPU"];
const KEY="gmi-stt-disk-check-v1";
const byDisk=new Map(), bySrv=new Map();
DATA.forEach(s=>{bySrv.set(s.sn,s); s.d.forEach((d,i)=>byDisk.set(d,{s,slot:i+1}));});
let state={d:{}}, filter="all", query="", hit=null, canSave=false;

/* ---------- storage (browser localStorage — private to this device/browser) ---------- */
async function load(){
  try{ const raw=localStorage.getItem(KEY); canSave=true; if(raw) state=JSON.parse(raw); }
  catch(e){ canSave=false; }
}
let saveT=null;
function save(){
  if(!canSave) return;
  clearTimeout(saveT);
  saveT=setTimeout(()=>{ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){ canSave=false; } },350);
}

/* ---------- state helpers ---------- */
const isD=sn=>!!state.d[sn];
const nDone=s=>s.d.reduce((a,x)=>a+(isD(x)?1:0),0);
const srvDone=s=>nDone(s)===24;
function setDisk(sn,v){ if(v) state.d[sn]=1; else delete state.d[sn]; }
function setSrv(s,v){ s.d.forEach(d=>setDisk(d,v)); }

/* ---------- render ---------- */
function tally(){
  const el=document.getElementById("tally");
  const total={n:DATA.length,done:DATA.filter(srvDone).length,dk:Object.keys(state.d).length};
  let h=`<div class="t"><div class="n">${total.done}<small> / ${total.n}</small></div>
    <div class="lbl">${t.srv}</div><div class="bar"><i style="width:${total.done/total.n*100}%"></i></div></div>`;
  BRANDS.forEach(b=>{
    const g=DATA.filter(s=>s.b===b), dn=g.filter(srvDone).length;
    h+=`<div class="t" data-b="${b}"><div class="n">${dn}<small> / ${g.length}</small></div>
      <div class="lbl">${b}</div><div class="bar"><i style="width:${dn/g.length*100}%"></i></div></div>`;
  });
  el.innerHTML=h;
  document.getElementById("c-all").textContent=DATA.length;
  BRANDS.forEach(b=>document.getElementById("c-"+b).textContent=DATA.filter(s=>s.b===b).length);
  document.getElementById("c-todo").textContent=DATA.filter(s=>!srvDone(s)).length;
  document.getElementById("c-done").textContent=total.done;
}

function match(s){
  if(filter==="todo"&&srvDone(s))return false;
  if(filter==="done"&&!srvDone(s))return false;
  if(BRANDS.includes(filter)&&s.b!==filter)return false;
  if(!query)return true;
  const q=query.toUpperCase();
  return s.sn.toUpperCase().includes(q)||s.b.includes(q)||s.fw.toUpperCase().includes(q)
    ||s.boot.toUpperCase().includes(q)||s.d.some(d=>d.toUpperCase().includes(q));
}

function diskHTML(s){
  const q=query.toUpperCase();
  return `<p class="meta">${t.boot}: <span class="mono">${s.boot}</span> · ${t.fw} <span class="mono">${s.fw}</span> · MO <span class="mono">${s.po}</span></p>
  <div class="grid">`+s.d.map((d,i)=>{
    const on=isD(d), hl=(hit===d)||(q.length>3&&d.toUpperCase().includes(q));
    return `<label class="d${on?" on":""}${hl?" hit":""}" data-disk="${d}">
      <input type="checkbox" data-disk="${d}"${on?" checked":""}>
      <span class="slot mono">${i+1}</span><span class="sn mono">${d}</span></label>`;
  }).join("")+`</div>`;
}

function render(){
  const list=document.getElementById("list");
  const rows=DATA.filter(match);
  document.getElementById("count").textContent=t.showing(rows.length);
  if(!rows.length){
    list.innerHTML=`<div class="empty"><b>${t.nores}</b><br>${t.nores2}</div>`;
    tally(); return;
  }
  list.innerHTML=rows.map(s=>{
    const n=nDone(s), full=n===24, open=openSet.has(s.sn);
    return `<section class="srv${full?" done":""}${open?" open":""}" data-b="${s.b}" data-sn="${s.sn}">
      <div class="head">
        <input type="checkbox" data-srv="${s.sn}"${full?" checked":""} aria-label="${s.sn}">
        <span class="id mono">${s.sn}</span>
        <span class="tag" data-b="${s.b}">${s.b}</span>
        <span class="fw mono">${s.fw}</span>
        <span class="prog"><b>${n}</b> / 24 ${t.dsk}</span>
        <button class="toggle" data-t="${s.sn}">${open?t.close:t.open}</button>
      </div>
      <div class="disks">${open?diskHTML(s):""}</div>
    </section>`;
  }).join("");
  tally();
}
const openSet=new Set();

/* ---------- events ---------- */
document.getElementById("list").addEventListener("click",e=>{
  const tg=e.target.closest("[data-t]");
  if(tg){ const sn=tg.dataset.t; openSet.has(sn)?openSet.delete(sn):openSet.add(sn); render(); return; }
});
document.getElementById("list").addEventListener("change",e=>{
  const el=e.target;
  if(el.dataset.srv){ setSrv(bySrv.get(el.dataset.srv), el.checked); save(); render(); }
  else if(el.dataset.disk){ setDisk(el.dataset.disk, el.checked); save(); render(); }
});

const q=document.getElementById("q");
q.addEventListener("input",()=>{ if(!document.getElementById("scan").checked){ query=q.value.trim(); hit=null; render(); }});
q.addEventListener("keydown",e=>{
  if(e.key!=="Enter")return;
  const v=q.value.trim(); if(!v)return;
  const up=v.toUpperCase();
  const dk=byDisk.get(v)||byDisk.get(up);
  const sv=bySrv.get(v)||bySrv.get(up);
  if(dk){
    if(isD(dk.s.d[dk.slot-1])) toast(t.already(v));
    else{ setDisk(dk.s.d[dk.slot-1],true); save(); toast(t.tickd(v,dk.s.sn)); }
    hit=dk.s.d[dk.slot-1]; openSet.add(dk.s.sn); query=""; q.value="";
  } else if(sv){
    setSrv(sv,true); save(); toast(t.ticks(sv.sn)); hit=null; query=sv.sn; q.value=sv.sn;
  } else { toast(t.notfound(v),true); query=v; }
  render();
});
document.getElementById("scan").addEventListener("change",e=>{
  if(e.target.checked){ query=""; q.value=""; render(); }
  q.focus();
});

document.querySelectorAll(".chip").forEach(c=>c.addEventListener("click",()=>{
  filter=c.dataset.f;
  document.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed",x===c));
  render();
}));

document.getElementById("expand").addEventListener("click",()=>{
  const rows=DATA.filter(match);
  const allOpen=rows.every(s=>openSet.has(s.sn));
  rows.forEach(s=>allOpen?openSet.delete(s.sn):openSet.add(s.sn));
  render(); paintLangStatic();
});
document.getElementById("reset").addEventListener("click",()=>{
  if(!confirm(t.rstq))return;
  state={d:{}}; openSet.clear(); save(); render();
});
document.getElementById("csv").addEventListener("click",()=>{
  const now=new Date().toISOString().slice(0,19).replace("T"," ");
  let rows=[["server_sn","brand","firmware","slot","disk_sn","checked","exported_at"]];
  DATA.forEach(s=>s.d.forEach((d,i)=>rows.push([s.sn,s.b,s.fw,i+1,d,isD(d)?"Y":"",now])));
  const csv="\ufeff"+rows.map(r=>r.join(",")).join("\r\n");
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
  a.download="DISK_check_"+now.slice(0,10).replace(/-/g,"")+".csv"; a.click();
});

let toastT=null;
function toast(msg,bad){
  const el=document.getElementById("toast");
  el.textContent=msg; el.className="show"+(bad?" bad":"");
  clearTimeout(toastT); toastT=setTimeout(()=>el.className="",2400);
}

/* ---------- language ---------- */
function paintLangStatic(){
  document.getElementById("ttl").textContent=t.ttl;
  document.getElementById("stl").textContent=t.stl;
  q.placeholder=t.ph;
  document.getElementById("scanlbl").textContent=t.scan;
  document.querySelector(".t-all").textContent=t.all;
  document.querySelector(".t-todo").textContent=t.todo;
  document.querySelector(".t-done").textContent=t.done;
  const rows=DATA.filter(match);
  document.querySelector(".t-exp").textContent=rows.length&&rows.every(s=>openSet.has(s.sn))?t.col:t.exp;
  document.querySelector(".t-csv").textContent=t.csv;
  document.querySelector(".t-rst").textContent=t.rst;
  document.getElementById("foot").innerHTML=t.foot+"<br>"+(canSave?t.saved:t.nosave);
  document.documentElement.lang=L==="zh"?"zh":(L==="en"?"en":"th");
}
document.querySelectorAll(".langs button").forEach(b=>b.addEventListener("click",()=>{
  L=b.dataset.lang; t=T[L];
  document.querySelectorAll(".langs button").forEach(x=>x.setAttribute("aria-pressed",x===b));
  paintLangStatic(); render();
}));

/* ---------- boot ---------- */
load().then(()=>{ paintLangStatic(); render(); q.focus(); });
</script>
</body>
</html>
